<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Walking Site</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400..700&family=Fleur+De+Leah&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Mozilla+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400..700&family=Fleur+De+Leah&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Mozilla+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="container my-5">
        <div class="row">
          <div class="col-12 text-center my-5">
            <h1>Dog Walking Services</h1>
            <p>We provide the best dog walking services in town</p>
          </div>
        </div>
        <h1>Our Services</h1>
        <div class="row">
          <div class="col-md-4">
            <div class="card my-5 outline">
              <div class="card-body">
                <h3>Potty breaks</h3>
                <p>We will walk your dog and make sure they come back clean</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card my-5 outline">
              <div class="card-body">
                <h3>Grooming</h3>
                <p>
                  Keep your dog with us and it'll come back looking brand new
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card my-5 outline">
              <div class="card-body">
                <h3>Exercising</h3>
                <p>We'll have your dog in the best shape of its life</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
